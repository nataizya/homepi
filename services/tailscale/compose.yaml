services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: tailscale
    environment:
      - TS_AUTHKEY=tskey-auth-kEvXpqScuM11CNTRL-16UP1vtVWWbV5x1gB3qmWbrW5BYVUD4J
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - /opt/pi-stack/data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped



