name: Deploy Stack to Pi

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy services
        run: |
          docker network create internal 2>/dev/null || true
          docker compose pull
          docker compose up -d --remove-orphans
